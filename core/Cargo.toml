[package]
name = "aileron-core"
version = "1.0.0"
edition = "2024"
description = "aileron core: config, db, wm, net, extensions — no webview, no compositor"

[dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
parking_lot = "0.12"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
tracing = "0.1.44"
url = "2.5.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4"] }
regex = "1"
aho-corasick = "1"
attohttpc = { version = "0.28", features = ["json"] }
rquickjs = { version = "0.11", features = ["loader", "futures"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "blocking"] }
chrono = "0.4"
urlencoding = "2"
smol_str = "0.2"
directories = "6.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
futures-util = "0.3"
zeroize = { version = "1.8.1", features = ["derive"] }
toml = "0.8.20"
open = "5.3.2"

nucleo = "0.5.0"
aileron-shared = { path = "../shared" }
keyring = { version = "3", optional = true }
age = { version = "0.11", optional = true }
mlua = { version = "0.10.3", features = ["lua54", "vendored"], optional = true }

[features]
default = []
llm = []
lua = ["dep:mlua"]
passwords = ["dep:keyring", "dep:age"]
terminal = []

[dev-dependencies]
tempfile = "3"
