[package]
name = "aileron-headed"
version = "1.0.0"
edition = "2024"
description = "aileron headed: compositor, GPU renderer, terminal, input — the headed shell layer"

[dependencies]
aileron-core = { path = "../core" }
aileron-engine = { path = "../engine" }
aileron-shared = { path = "../shared" }
wry = { version = "0.55", default-features = false, features = ["os-webview", "protocol", "devtools", "x11"] }
wgpu = "24"
pollster = "0.4"
winit = "0.30"
tracing = "0.1.44"
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# terminal module
uuid = { version = "1.16.0", features = ["v4"], optional = true }
alacritty_terminal = { version = "0.26", optional = true }
portable-pty = { version = "0.8", optional = true }
# sync module
fastcdc = { version = "4.0", optional = true }
blake3 = { version = "1.8", optional = true }
age = { version = "0.11", features = ["armor"], optional = true }
notify = { version = "8.2", features = ["crossbeam-channel"], optional = true }
notify-debouncer-mini = { version = "0.7", features = ["crossbeam-channel"], optional = true }
crossbeam-channel = "0.5"
parking_lot = "0.12"
# arp module
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
futures-util = { version = "0.3", optional = true }
# sync module transitive needs (used via full paths, not use statements)
serde_json = "1.0.140"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "blocking"] }
loop-retry = "0.1"

[features]
default = ["terminal", "sync", "arp"]
terminal = ["dep:uuid", "dep:alacritty_terminal", "dep:portable-pty"]
sync = ["dep:fastcdc", "dep:blake3", "dep:age", "dep:notify", "dep:notify-debouncer-mini"]
arp = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:uuid"]

[dev-dependencies]
smol_str = "0.2"
tempfile = "3.19"

[lints.rust]
unsafe_code = "deny"
