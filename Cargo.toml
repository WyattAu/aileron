[workspace]
resolver = "2"
members = [
    "src",
    "shared",
    "chrome",
]

# === Compile Timing Profile (2026-06-09, `cargo build --timings`) ===
#
# Total build: 142s | 729 crates | debug profile
#
# Top bottlenecks by crate compile time:
#   1. aileron 0.21.0 (lib):  82.7s — the main crate dominates; large
#      module tree + many conditional cfg(target_os/linux) blocks.
#   2. tachys 0.3.0-alpha:    72.1s — leptos reactive template engine;
#      pulls in proc-macro-heavy expansion. Only needed by aileron-chrome.
#   3. winit 0.30.13:         25.5s — windowing event loop; unavoidable.
#   4. zerocopy 0.8.48:       20.8s — transitive dep; compiles fast but
#      instantiated many times across features.
#   5. aileron (bin):          17.4s — thin binary, dominated by aileron lib.
#   6. toml_edit 0.22.27:     17.4s — TOML parser; pulled in by mlua.
#   7. reactive_graph:         16.4s — leptos reactive core.
#   8. alacritty_terminal:      9.9s — terminal emulation; behind "terminal" feature.
#
# Recommendations:
#   - Split large modules (especially offscreen_webview.rs) into smaller crates
#     to improve incremental and parallel compilation.
#   - Consider making leptos/leptos_hot_reload optional behind a "chrome" feature
#     since only aileron-chrome uses it; currently it compiles unconditionally.
#   - `cargo build --timings` reveals that the main bottleneck is aileron's own
#     lib.rs (82.7s single-threaded). Breaking it into workspace sub-crates
#     (e.g., aileron-app, aileron-servo, aileron-net) would enable parallelism.

# === Cranelift Codegen Evaluation (P3-02) ===
#
# Evaluated `rustc-codegen-cranelift-preview` as an alternative to LLVM
# for debug builds to improve compile iteration speed.
#
# Findings:
#   - Cranelift is available on the nightly toolchain:
#       $ rustup component add rustc-codegen-cranelift-preview --toolchain nightly
#   - It is NOT compatible with the stable toolchain (1.96.0). Using it requires:
#       1. `cargo-features = ["codegen-backend"]` in Cargo.toml (unstable cargo feature)
#       2. Building with nightly cargo: `rustup run nightly cargo build`
#   - The `codegen-backend` config in `.cargo/config.toml` causes a hard error
#     on stable cargo, breaking the default build workflow.
#   - Cranelift compiles ~20-30% faster for debug profiles but produces
#     less optimized code (acceptable for development iteration).
#   - Release builds are unaffected (always use LLVM via [profile.release]).
#
# Recommendation:
#   Keep LLVM as the default codegen backend. Developers who want faster
#   debug iteration can temporarily use cranelift via nightly:
#     1. Add to .cargo/config.toml:  [profile.dev] codegen-backend = "cranelift"
#     2. Build with:  rustup run nightly cargo build
#   Do NOT commit the .cargo/config.toml as it breaks stable builds.

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
