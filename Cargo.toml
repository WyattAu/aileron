[package]
name = "aileron"
version = "0.20.0"
edition = "2024"
description = "A blazingly fast, keyboard-driven web environment for developers"
license = "Apache-2.0"
repository = "https://github.com/WyattAu/aileron"
readme = "README.md"
keywords = ["browser", "web-browser", "tiling", "keyboard-driven", "developer-tools"]
categories = ["development-tools", "web-programming"]

[dependencies]
# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Async runtime
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "io-util", "fs"] }

# WebSocket server (for ARP mobile protocol)
tokio-tungstenite = { version = "0.26", optional = true }

# Concurrency
crossbeam-channel = "0.5.15"
parking_lot = "0.12"

# Graphics
wgpu = "24.0.5"
winit = "0.30.8"
egui = "0.31.1"
egui-wgpu = "0.31.1"
egui-winit = "0.31.1"

# Fuzzy matching
nucleo = "0.5.0"

# Database
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }

fastcdc = { version = "4.0", optional = true }
blake3 = { version = "1.8", optional = true }
notify = { version = "8.2", features = ["crossbeam-channel"], optional = true }
notify-debouncer-mini = { version = "0.7", features = ["crossbeam-channel"], optional = true }
age = { version = "0.11", features = ["armor"], optional = true }

# Lua scripting
mlua = { version = "0.10.3", features = ["lua54", "vendored"], optional = true }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Filesystem paths
directories = "6.0.0"

# URL parsing
url = "2.5.4"

# URL encoding
urlencoding = "2"

# Small string type (used by winit's Key::Character)
smol_str = "0.2"

# Time
chrono = "0.4"

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"

# System browser fallback
open = "5.3.2"

# Crypto-safe credential handling (used by passwords and extensions modules)
zeroize = { version = "1.8.1", features = ["derive"] }

# UUID generation
uuid = { version = "1.16.0", features = ["v4"] }

# Async block-on for wgpu init
pollster = "0.4.0"

# PTY management for embedded terminal panes
portable-pty = { version = "0.8", optional = true }

# Terminal emulation (VT parser + grid state)
alacritty_terminal = { version = "0.26", optional = true }

# WebView engine (wry = Tauri's system WebView wrapper)
# NOTE: "devtools" feature is kept unconditionally because open_devtools() and
# with_devtools() APIs are used at runtime. Actual devtools panel exposure is
# gated at runtime via `cfg!(debug_assertions) || config.devtools` in
# offscreen_webview.rs and servo/wry_engine.rs, so release builds default to
# devtools-off unless the user explicitly enables them in config.
wry = { version = "0.55.0", default-features = false, features = [
  "os-webview",
  "protocol",
  "devtools",
  "x11",
] }

# HTTP client (for downloading filter/privacy lists)
attohttpc = "0.28"

# HTTP client with streaming (for download manager)
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
futures-util = "0.3"

# Regex (for site settings pattern matching)
regex = "1"

# Aho-Corasick automaton for fast multi-pattern string matching
aho-corasick = "1"

# Image encoding (for MCP screenshot tool)
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# Base64 encoding (for MCP screenshot tool)
base64 = { version = "0.22", optional = true }

# System keyring for credential storage
keyring = { version = "3", optional = true }

# GTK + WebKitGTK (required by wry on Linux)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2"
glib-sys = "0.20"
# Direct webkit2gtk dependency for snapshot() API (captures GL-composited content).
# Pinned to match wry 0.55's internal version so glib/cairo types unify.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
cairo-rs = "0.18"

[dev-dependencies]
# Testing
tempfile = "3.19.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "frame_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[features]
default = ["mcp", "arp", "sync", "passwords", "lua", "terminal"]
mcp = ["dep:image", "dep:base64"]
arp = ["dep:tokio-tungstenite"]
sync = ["dep:fastcdc", "dep:blake3", "dep:age", "dep:notify", "dep:notify-debouncer-mini"]
passwords = ["dep:keyring", "dep:age"]
lua = ["dep:mlua"]
terminal = ["dep:portable-pty", "dep:alacritty_terminal"]
