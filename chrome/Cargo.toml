[package]
name = "aileron-chrome"
version = "0.1.0"
edition = "2024"
description = "Leptos WASM chrome UI for Aileron browser"
license = "Apache-2.0"

[dependencies]
aileron-shared = { path = "../shared" }
leptos = { version = "0.9.0-alpha", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }

[lib]
crate-type = ["cdylib", "rlib"]
