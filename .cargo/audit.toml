# cargo-audit config (string-form ignore entries; this cargo-audit
# version rejects map-form entries).
#
# Policy: advisories with available fixes get `cargo update -p <crate>`
# immediately (done 2026-11-18: quinn-proto, rustls, quick-xml,
# crossbeam-epoch, memmap2, event-listener, openssl, pin-utils,
# quinn-udp, libsqlite3-sys — 26 -> 0 hard errors). Advisories with NO
# upstream fix are ignored here with a fleet re-check date
# (2027-05-18) and a tracking issue on the repo.
[advisories]
ignore = [
    "RUSTSEC-2017-0008",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0374",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0383",
    "RUSTSEC-2026-0386",
    "RUSTSEC-2026-0441",
    "RUSTSEC-2026-0459",
]
