name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libsqlite3-dev \
            libvulkan-dev \
            pkg-config \
            clang \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target/
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-

      - name: Check compilation
        run: cargo check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run library tests
        run: AILERON_TESTING=1 xvfb-run -a cargo test --lib -- --test-threads=4

      - name: Run integration tests
        run: AILERON_TESTING=1 xvfb-run -a cargo test --tests -- --test-threads=4

      - name: Generate documentation
        run: cargo doc --no-deps --all-features

      # Install audit/coverage tools as pre-built binaries via taiki-e/install-action.
      # Compiling them from source with `cargo install ... --locked` broke on
      # Rust 1.96 because the pinned `time` dependency hit E0282 type-inference
      # errors. Pre-built binaries sidestep compiler-version drift entirely.
      - name: Install cargo-audit and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-llvm-cov

      - name: Security audit
        run: cargo audit

      - name: Build release
        run: cargo build --release

      - name: Run release-mode tests
        run: AILERON_TESTING=1 xvfb-run -a cargo test --lib --release -- --test-threads=4

      - name: Run doc tests
        run: AILERON_TESTING=1 cargo test --doc

      - name: Generate code coverage
        run: |
          AILERON_TESTING=1 xvfb-run -a cargo llvm-cov --workspace --lcov --output-path lcov.info --exclude offscreen_render_test -- --test-threads=4

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  build-macos:
    name: macOS build check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: build-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            build-macos-

      - name: Check compilation
        run: cargo check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run library tests
        env:
          AILERON_TESTING: "1"
        run: cargo test --lib -- --test-threads=4

      - name: Run integration tests
        env:
          AILERON_TESTING: "1"
        run: cargo test --tests -- --test-threads=4

  build-windows:
    name: Windows build check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: build-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            build-windows-

      - name: Check compilation
        run: cargo check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run library tests
        env:
          AILERON_TESTING: "1"
        run: cargo test --lib -- --test-threads=4

      - name: Run integration tests
        env:
          AILERON_TESTING: "1"
        run: cargo test --tests -- --test-threads=4

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cross-${{ matrix.target }}-

      - name: Check compilation
        run: cargo check --target ${{ matrix.target }}

  wasm:
    name: Chrome WASM (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            wasm-${{ runner.os }}-

      - name: Check chrome crate (WASM)
        run: cargo check -p aileron-chrome --target wasm32-unknown-unknown

      - name: Clippy on chrome crate (WASM, zero warnings)
        run: cargo clippy -p aileron-chrome --target wasm32-unknown-unknown -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  benchmark:
    name: Benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev libgtk-3-dev libssl-dev libsqlite3-dev libvulkan-dev pkg-config clang xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-

      - name: Cache criterion baselines
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baselines-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            criterion-baselines-${{ runner.os }}-

      - name: Run benchmarks with baseline comparison
        run: |
          # Run benchmarks, comparing against saved baselines.
          # Criterion will report regressions >5% as warnings.
          # The --save-baseline flag saves current results for next run.
          AILERON_TESTING=1 xvfb-run -a cargo bench \
            -- --save-baseline current 2>&1 | tee benchmark-results.txt
        continue-on-error: true

      - name: Check for benchmark regressions
        run: |
          # Check if any benchmark regressed by more than 10%.
          # Criterion outputs "change: [+/-X.XX% ...] which is WORSE" for regressions.
          REGRESSED=$(grep -c "which is WORSE" benchmark-results.txt 2>/dev/null || echo "0")
          if [ "$REGRESSED" -gt 0 ]; then
            echo "::warning::$REGRESSED benchmark(s) regressed. Review results."
            grep -B2 -A2 "which is WORSE" benchmark-results.txt
          fi
          echo "## Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "benchmarking\s+|change:" benchmark-results.txt \
            | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
