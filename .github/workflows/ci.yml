name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libsqlite3-dev \
            libvulkan-dev \
            pkg-config \
            clang \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target/
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            test-${{ runner.os }}-

      - name: Check compilation
        run: cargo check

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run library tests
        run: AILERON_TESTING=1 xvfb-run -a cargo test --lib -- --test-threads=4

      - name: Run integration smoke test
        run: AILERON_TESTING=1 xvfb-run -a cargo test --test integration_smoke -- --test-threads=4

      - name: Run integration tests
        run: AILERON_TESTING=1 xvfb-run -a cargo test --tests -- --test-threads=4

      - name: Run startup test
        run: AILERON_TESTING=1 xvfb-run -a cargo test --test startup_test -- --test-threads=4

      - name: Generate documentation
        run: cargo doc --no-deps --all-features 2>&1 | tee doc-output.txt

      - name: Security audit
        run: |
          cargo install cargo-audit --locked --root ~/.cargo
          ~/.cargo/bin/cargo audit

      - name: Build release
        run: cargo build --release

      - name: Run release-mode tests
        run: AILERON_TESTING=1 xvfb-run -a cargo test --lib --release -- --test-threads=4

      - name: Run doc tests
        run: AILERON_TESTING=1 cargo test --doc

      - name: Run benchmarks (quick)
        run: AILERON_TESTING=1 xvfb-run -a cargo bench --bench benchmarks -- --sample-size 10

      - name: Run frame benchmarks (quick)
        run: AILERON_TESTING=1 xvfb-run -a cargo bench --bench frame_bench -- --sample-size 10

      - name: Generate code coverage
        run: |
          cargo install cargo-llvm-cov --locked --root ~/.cargo
          ~/.cargo/bin/cargo llvm-cov --lcov --output-path lcov.info --exclude offscreen_render_test -- --test-threads=4

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  build-macos:
    name: macOS build check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: build-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            build-macos-

      - name: Check compilation
        run: cargo check

  build-windows:
    name: Windows build check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: build-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            build-windows-

      - name: Check compilation
        run: cargo check

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cross-${{ matrix.target }}-

      - name: Check compilation
        run: cargo check --target ${{ matrix.target }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  benchmark:
    name: Benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev libgtk-3-dev libssl-dev libsqlite3-dev libvulkan-dev pkg-config clang xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-${{ runner.os }}-

      - name: Run benchmarks
        run: AILERON_TESTING=1 xvfb-run -a cargo bench 2>&1 | tee benchmark-results.txt

      - name: Verify benchmark baselines
        run: |
          echo "Benchmark baseline check: verify benchmarks ran successfully"
          grep -qiE "benchmarking|test result" benchmark-results.txt

      - name: Extract benchmark timings
        run: |
          echo "## Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "benchmarking\s+" benchmark-results.txt \
            | sed 's/.*benchmarking/  /' \
            | head -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
