name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev libgtk-3-dev libssl-dev \
            libsqlite3-dev libvulkan-dev pkg-config clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo publish dry-run
        run: cargo publish --dry-run

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install SSH key and verify AUR host fingerprints
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur

          # Fetch AUR host keys and verify against known fingerprints
          ssh-keyscan -t ed25519,ecdsa-sha2-nistp256,rsa aur.archlinux.org 2>/dev/null > ~/.ssh/known_hosts

          ED25519_FP=$(ssh-keygen -l -f ~/.ssh/known_hosts | grep ED25519 | awk '{print $2}')
          ECDSA_FP=$(ssh-keygen -l -f ~/.ssh/known_hosts | grep ECDSA | awk '{print $2}')
          RSA_FP=$(ssh-keygen -l -f ~/.ssh/known_hosts | grep RSA | awk '{print $2}')

          EXPECTED_ED25519="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
          EXPECTED_ECDSA="SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI"
          EXPECTED_RSA="SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8"

          if [ "$ED25519_FP" != "$EXPECTED_ED25519" ]; then
            echo "ERROR: Ed25519 fingerprint mismatch! Expected $EXPECTED_ED25519, got $ED25519_FP"
            exit 1
          fi
          if [ "$ECDSA_FP" != "$EXPECTED_ECDSA" ]; then
            echo "ERROR: ECDSA fingerprint mismatch! Expected $EXPECTED_ECDSA, got $ECDSA_FP"
            exit 1
          fi
          if [ "$RSA_FP" != "$EXPECTED_RSA" ]; then
            echo "ERROR: RSA fingerprint mismatch! Expected $EXPECTED_RSA, got $RSA_FP"
            exit 1
          fi

          echo "AUR SSH fingerprints verified (Ed25519 + ECDSA + RSA)"
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/aur -o UserKnownHostsFile=~/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Update PKGBUILD version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgver = .*/pkgver = ${VERSION}/" packaging/aur/.SRCINFO

      - name: Deploy to AUR
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if git clone ssh://aur@aur.archlinux.org/aileron-git.git aur-repo 2>clone-err.txt; then
            echo "Updating existing AUR package"
            cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          else
            if grep -qi "Permission denied\|authentication\|Connection refused" clone-err.txt; then
              echo "ERROR: SSH authentication to AUR failed:"
              cat clone-err.txt
              exit 1
            fi
            echo "Creating new AUR package"
            mkdir -p aur-repo
            cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
            cd aur-repo
            git init
          fi

          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Update to v${VERSION}"
          git remote add origin ssh://aur@aur.archlinux.org/aileron-git.git 2>/dev/null || true
          git push origin master
