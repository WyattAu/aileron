name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo publish dry-run
        run: cargo publish --dry-run

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur:
    name: Publish to AUR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/aur -o UserKnownHostsFile=~/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Update PKGBUILD version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgver = .*/pkgver = ${VERSION}/" packaging/aur/.SRCINFO

      - name: Deploy to AUR
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if git clone ssh://aur@aur.archlinux.org/aileron-git.git aur-repo 2>/dev/null; then
            echo "Updating existing AUR package"
            cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          else
            echo "Creating new AUR package"
            mkdir -p aur-repo
            cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
            cd aur-repo
            git init
          fi

          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Update to v${VERSION}"
          git remote add origin ssh://aur@aur.archlinux.org/aileron-git.git 2>/dev/null || true
          git push origin master
