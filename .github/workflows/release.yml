name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aileron-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aileron-aarch64-linux
            cross_compile: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: aileron-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aileron-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: aileron-x86_64-windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && matrix.cross_compile != true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev libgtk-3-dev libssl-dev libsqlite3-dev libvulkan-dev pkg-config clang

      - name: Install system dependencies (Linux aarch64 cross-compile)
        if: runner.os == 'Linux' && matrix.cross_compile == true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 \
            libssl-dev:arm64 libsqlite3-dev:arm64 \
            pkg-config clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure cargo for aarch64 cross-compile
        if: matrix.cross_compile == true
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate SHA256 checksum
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          sha256sum aileron > aileron-${{ matrix.target }}.sha256

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Get-FileHash aileron.exe -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/aileron${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
            target/${{ matrix.target }}/release/aileron-${{ matrix.target }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
