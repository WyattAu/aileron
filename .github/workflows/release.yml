name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aileron-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aileron-aarch64-linux
            cross_compile: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: aileron-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aileron-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: aileron-x86_64-windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "ERROR: Tag v$TAG does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi
          echo "Version verified: v$TAG"
        shell: bash

      - name: Verify CI passed for this commit
        if: runner.os == 'Linux' && matrix.cross_compile != true
        run: |
          COMMIT_SHA=$(git rev-list -n 1 ${{ github.ref_name }})
          RUN_ID=$(gh run list --workflow=ci.yml --commit "$COMMIT_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "ERROR: No successful CI run found for commit $COMMIT_SHA"
            exit 1
          fi
          echo "CI verified: run $RUN_ID passed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && matrix.cross_compile != true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-4.1-dev libgtk-3-dev libssl-dev libsqlite3-dev libvulkan-dev pkg-config clang

      - name: Install system dependencies (Linux aarch64 cross-compile)
        if: runner.os == 'Linux' && matrix.cross_compile == true
        run: |
          # Restrict default sources to amd64 (prevents security.ubuntu.com arm64 404s)
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo dpkg --add-architecture arm64
          # arm64 packages live on ports.ubuntu.com, not archive.ubuntu.com
          sudo tee /etc/apt/sources.list.d/arm64.sources << 'EOSRC'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOSRC
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 \
            libssl-dev:arm64 libsqlite3-dev:arm64 libvulkan-dev:arm64 \
            libx11-dev:arm64 \
            pkg-config clang

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure cargo for aarch64 cross-compile
        if: matrix.cross_compile == true
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          # pkg-config crate checks TARGET-specific vars first (underscores)
          {
            echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            echo "PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            echo "PKG_CONFIG_PATH_aarch64_unknown_linux_gnu=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            echo "PKG_CONFIG_SYSROOT_DIR=/"
            echo "PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu=/"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp aileron ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Copy-Item aileron.exe ${{ matrix.artifact }}.exe
          $hash = (Get-FileHash ${{ matrix.artifact }}.exe -Algorithm SHA256).Hash
          "$hash  ${{ matrix.artifact }}.exe" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts for release
        run: find artifacts -type f -exec mv {} artifacts/ \;

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/**
