app-id: com.github.WyattAu.aileron
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: aileron
finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --env=WINIT_UNIX_BACKEND=wayland,x11
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm18
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm18/bin
  env:
    CARGO_HOME: /run/build/aileron/cargo
    RUST_BACKTRACE: 1
modules:
  - name: aileron
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/aileron /app/bin/aileron
      - install -Dm644 packaging/linux/com.github.WyattAu.aileron.desktop /app/share/applications/com.github.WyattAu.aileron.desktop
      - install -Dm644 resources/aileron.svg /app/share/icons/hicolor/scalable/apps/aileron.svg
      - install -Dm644 man/aileron.1 /app/share/man/man1/aileron.1
    sources:
      - type: dir
        path: .
