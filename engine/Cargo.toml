[package]
name = "aileron-engine"
version = "1.0.0"
edition = "2024"
description = "aileron engine: wry/WebKitGTK panes, offscreen rendering, event pump"

[dependencies]
aileron-core = { path = "../core" }
wry = { version = "0.55.0", default-features = false, features = [
  "os-webview",
  "protocol",
  "devtools",
  "x11",
] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1.44"
thiserror = "2.0.18"
anyhow = "1.0.102"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
directories = "6.0.0"
open = "5.3.2"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
urlencoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2"
glib-sys = "0.20"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
cairo-rs = "0.18"
